[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glst"
version = "0.1.0"
description = "GLST: Global-Local Spatio-Temporal Memory Decomposition Framework for Online Chained-Goal Navigation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Yousef Liang" },
    { name = "Ryan Ardalan" },
    { name = "Yarden Goraly" },
    { name = "Chenhao Zhu" },
    { name = "Lizzi (Yue) Yin" },
    { name = "Jonas Frey" },
    { name = "Claire Tomlin" },
    { name = "Marco Pavone" },
    { name = "Shankar Sastry" },
]
keywords = ["robotics", "navigation", "reinforcement-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/Yousef-Liang/glst"
Repository = "https://github.com/Yousef-Liang/glst"
Issues = "https://github.com/Yousef-Liang/glst/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["glst*"]

[tool.setuptools.package-data]
glst = ["py.typed"]
